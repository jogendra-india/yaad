name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yaad.jks"
            echo "YAAD_KEYSTORE=$RUNNER_TEMP/yaad.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          YAAD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YAAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YAAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$YAAD_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease
            src=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew --no-daemon assembleDebug
            src=app/build/outputs/apk/debug/app-debug.apk
          fi
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          mkdir -p out && cp "$src" "out/yaad-$name-$VERSION_CODE.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: yaad-apk
          path: out/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: Yaad ${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          body: Built from ${{ github.sha }}. Download the APK below and install on Android.
          files: out/*.apk
